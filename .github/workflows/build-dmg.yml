name: Publish FreeLingo signed update

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Source archive placed in repository root (zip)'
        required: true
        default: 'FreeLingo066.zip'
        type: string

permissions:
  contents: write

concurrency:
  group: freelingo-release
  cancel-in-progress: false

jobs:
  setup:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Import next release source ZIP
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_ZIP" =~ ^[a-zA-Z0-9_.-]+\.zip$ ]] || { echo 'Invalid ZIP name'; exit 1; }
          test -f "$SOURCE_ZIP" || { echo "Upload $SOURCE_ZIP to the repository root first"; exit 1; }
          unzip -oq "$SOURCE_ZIP" -d .
          rm -f "$SOURCE_ZIP"
      - name: Require release signing keys
        env:
          PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        shell: bash
        run: |
          [[ -n "$PUBLIC_KEY" && -n "$PRIVATE_KEY" ]] || { echo 'Configure Sparkle public variable and private secret, then rerun'; exit 1; }
      - name: Import optional persistent code signing certificate
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12_BASE64" ]]; then
            echo 'WARNING: no persistent macOS signing identity; Accessibility may reset each update.'
            exit 0
          fi
          [[ -n "$CERT_PASSWORD" ]] || { echo 'ERROR: missing P12 password'; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/FreeLingoSigning.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/FreeLingoSigning.p12"
          umask 077
          printf '%s' "$CERT_P12_BASE64" | base64 -D > "$P12" || \
            { echo 'P12 base64 invalid'; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          # codesign needs the imported keychain on the user's search list,
          # even when --keychain is supplied for identity selection.
          # Preserve all existing entries (including paths containing spaces).
          PREVIOUS_KEYCHAINS=()
          while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry#\"}"
            entry="${entry%\"}"
            [[ -z "$entry" ]] || PREVIOUS_KEYCHAINS+=("$entry")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${PREVIOUS_KEYCHAINS[@]}"
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychains -d user
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Take the first imported identity; the signing P12 must contain only one identity.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | sed -nE 's/^[[:space:]]*[0-9]+\) ([0-9A-F]{40}) .*/\1/p' | head -1)"
          [[ -n "$IDENTITY" ]] || { echo 'ERROR: P12 has no usable code-signing identity'; exit 1; }
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo 'REQUIRE_STABLE_SIGNING=1' >> "$GITHUB_ENV"
          echo 'Permanent code signing identity imported for build.'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build signed-update-capable .app and DMG
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          REQUIRE_SPARKLE_SIGNING: '1'
        shell: bash
        run: |
          python3 tests/check_release.py
          chmod +x build-macos.sh
          ./build-macos.sh
      - name: Sign Sparkle ZIP and create update feed
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/FreeLingo.app/Contents/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/FreeLingo.app/Contents/Info.plist)
          KEYFILE="$RUNNER_TEMP/sparkle-private.key"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          ARCHIVE="dist/FreeLingo-${VERSION}-AppleSilicon.zip"
          "$GITHUB_WORKSPACE/.build/Sparkle-2.9.6/bin/sign_update" -f "$KEYFILE" "$ARCHIVE" > "$RUNNER_TEMP/signature.xmlattrs"
          python3 scripts/create_appcast.py --version "$VERSION" --build "$BUILD" \
            --archive "$ARCHIVE" --signature-file "$RUNNER_TEMP/signature.xmlattrs" --output appcast.xml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish initial Github release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v$VERSION" >/dev/null 2>&1 && { echo 'Release already exists'; exit 1; }
          gh release create "v$VERSION" \
            "dist/FreeLingo-${VERSION}-AppleSilicon.zip" \
            "dist/FreeLingo-${VERSION}-AppleSilicon.dmg" \
            --title "FreeLingo $VERSION" --notes 'Signed FreeLingo update with in-app installation.'
      - name: Store update feed and source files in repository
        shell: bash
        run: |
          set -euo pipefail
          # Preserve this published workflow; GITHUB_TOKEN may not be allowed
          # to create or edit .github/workflows in an automated commit.
          git restore --source=HEAD --staged --worktree .github/workflows/build-dmg.yml
          rm -f .github/workflows/release.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "FreeLingo $VERSION - enable signed updates"
          git push origin HEAD:main
      - name: Upload DMG for bootstrap and recovery
        uses: actions/upload-artifact@v4
        with:
          name: FreeLingo-${{ env.VERSION }}-DMG
          path: dist/FreeLingo-${{ env.VERSION }}-AppleSilicon.dmg
          if-no-files-found: error
