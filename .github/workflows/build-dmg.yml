name: Install FreeLingo 0.6.0 and build DMG

on:
  workflow_dispatch:
    inputs:
      run_model_smoke:
        description: "Test an actual Qwen model (downloads 484 MB)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - name: Checkout current FreeLingo repository
        uses: actions/checkout@v4
      - name: Apply FreeLingo 0.6.0 source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f FreeLingo-0.6.0-update.zip || { echo 'Upload FreeLingo-0.6.0-update.zip to repository root first'; exit 1; }
          unzip -oq FreeLingo-0.6.0-update.zip -d .
          echo 'Imported FreeLingo 0.6.0 source'
      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Validate new source
        run: python3 tests/check_release.py
      - name: Build FreeLingo 0.6.0 DMG and signed-app-capable ZIP
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh
      - name: Smoke test local translation on macOS
        if: ${{ inputs.run_model_smoke }}
        run: python3 tests/smoke_macos.py
      - name: Upload DMG and update archive
        uses: actions/upload-artifact@v4
        with:
          name: FreeLingo-0.6.0-AppleSilicon
          path: |
            dist/FreeLingo-0.6.0-AppleSilicon.dmg
            dist/FreeLingo-0.6.0-AppleSilicon.dmg.sha256
            dist/FreeLingo-0.6.0-AppleSilicon.zip
          if-no-files-found: error
      - name: Save validated source back to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f FreeLingo-0.6.0-update.zip
          # Keep the existing workflow in place. A workflow cannot safely
          # assume GITHUB_TOKEN can install a new workflow file.
          git restore --source=HEAD --staged --worktree .github/workflows/build-dmg.yml
          rm -f .github/workflows/release.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FreeLingo 0.6.0: Dock, login item, menu icon and updater'
          git push origin HEAD:main
