[package]
name = "freelingo-core"
version = "0.6.11"
edition = "2021"
license = "MIT"
description = "Local translation core for FreeLingo macOS"

[lib]
name = "freelingo_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
